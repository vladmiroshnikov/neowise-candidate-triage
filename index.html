<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #draft { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" hidden aria-labelledby="result-title">
    <h2 id="result-title">Результат разбора</h2>
    <p>Тема: <span id="topic"></span></p>
    <h3>Черновик ответа</h3>
    <p id="draft"></p>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicNames = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    const manualReview = "Требуется ручной разбор. Проверьте заявку и подготовьте ответ.";
    let latestRequest = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++latestRequest;
      const text = message.value.trim();
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";

      if (!text) {
        status.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (requestId !== latestRequest) return;

        if (reply.ok && data.status === "ready") {
          topic.textContent = topicNames[data.topic];
          draft.textContent = data.draft;
          result.hidden = false;
          status.textContent = "Черновик готов.";
        } else if (reply.status === 400 && data.status === "invalid_input") {
          status.textContent = "Введите текст заявки.";
        } else {
          status.textContent = manualReview;
        }
      } catch {
        if (requestId === latestRequest) status.textContent = manualReview;
      }
    });
  </script>
</body>
</html>
